# Sammelt die Daten auf einem Rechner von GitHub, damit kein PC durchlaufen muss.
#
# Jeder Lauf sammelt knapp 6 Stunden lang jede Minute (GitHub erlaubt max. 6 h)
# und legt eine eigene kleine Datenbank in data/raw/ ab. Am Ende startet jeder
# Lauf selbst den nächsten. So entsteht eine Kette ohne große Lücken.
#
# Der stündliche Zeitplan ist nur die Reserve, falls die Kette einmal abreißt.
# GitHub führt ihn unzuverlässig aus (oft nur alle 4-7 Stunden), darum reicht
# er allein nicht. Weil "concurrency" nur einen Lauf gleichzeitig erlaubt,
# wartet ein zusätzlicher Lauf, bis der vorige fertig ist.
#
# Von Hand starten: GitHub -> Actions -> "Daten sammeln" -> "Run workflow".
# Sammeln stoppen:  gh workflow disable collect.yml  (wieder an: enable)

name: Daten sammeln

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Wie viele Minuten sammeln (zum Testen z. B. 3)"
        default: "340"

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    env:
      TZ: Europe/Vienna
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Sammeln
        run: |
          mkdir -p data/raw
          FILE="data/raw/$(date -u +%Y-%m-%dT%H%MZ).db"
          echo "FILE=$FILE" >> "$GITHUB_ENV"
          python -m tramcheck collect --minutes "${{ inputs.minutes || 340 }}" --database "$FILE"

      - name: Rohdaten ins Repo speichern
        if: always()
        run: |
          [ -f "$FILE" ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "Daten: $(basename "$FILE")"
          for attempt in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            sleep 10
          done
          exit 1

      # Nicht bei einem abgebrochenen Lauf: so kann man die Kette von Hand stoppen.
      - name: Nächsten Lauf starten
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect.yml --ref main
